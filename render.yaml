# Render blueprint — deploys the backend API only.
#
# The repo root is an npm workspace (frontend + admin + backend). Building from
# the root runs `npm run build` across all workspaces, and `backend` has no
# build script — that is why a root-directory deploy fails with
# `Missing script: "build"`. rootDir pins Render to backend/ so none of the
# workspace tooling is involved.
#
# The frontend and admin are static Vite builds and belong on Vercel, not here.

services:
  - type: web
    name: car-drivers-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      # Set these in the Render dashboard — never commit real values.
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 30d
      # Deployed origins allowed to call this API (CORS).
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_URL
        sync: false
